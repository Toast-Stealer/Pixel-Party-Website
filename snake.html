<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake — Pixel Party</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css?v=3"><script src="shared.js?v=3"></script>
</head>
<body class="game-page" style="--accent:#c8ff37">
<nav class="topbar game-nav">
<a class="brand" href="index.html">
<span>PIXEL</span> PARTY</a>
<div class="player-pill"><b data-player-icon>⚡</b><span data-points>0</span> PTS</div>
</nav>
<main class="game-shell">
<header class="game-head">
<div>
<a class="back" href="index.html">← ALL GAMES</a>
<h1 class="game-title">
<span>Snake</span>
</h1>
</div>
<div class="scoreboard">
<div>
<small>SCORE</small>
<strong id="score">000</strong>
</div>
<div>
<small>BEST</small>
<strong id="best">000</strong>
</div>
</div>
</header>
<div class="game-layout">
<div>
<div class="canvas-wrap">
<canvas id="game" width="600" height="600">
</canvas>
<div class="overlay" id="overlay">
<h2>SNAKE</h2>
<p>Eat the fruit. Fill the grid. Don't bite yourself.</p>
<button class="game-btn" id="start">START GAME</button>
</div>
</div>
<div class="touch-controls">
<button class="up" data-dir="up">↑</button>
<button class="left" data-dir="left">←</button>
<button class="down" data-dir="down">↓</button>
<button class="right" data-dir="right">→</button>
</div>
</div>
<aside class="side-panel">
<h3>HOW TO PLAY</h3>
<div class="controls-list">
<div class="control-row">
<span>Move</span>
<span>
<b class="key">WASD</b> <b class="key">↑↓←→</b>
</span>
</div>
<div class="control-row">
<span>Pause</span>
<b class="key">P</b>
</div>
</div>
<p class="tip">Every fruit makes you longer and a little faster. Edge wrapping is off—watch the walls.</p>
<button class="game-btn" id="restart">RESTART</button>
</aside>
</div>
</main>
<script src="snake.js">
</script>
</body>
</html>
